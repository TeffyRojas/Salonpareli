<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #e91e63;
            --secondary-color: #f8bbd9;
            --accent-color: #fce4ec;
            --dark-color: #2c3e50;
            --light-color: #f8f9fa;
        }

        body {
            background-image: url("make-up.jpg"); /* Imagen de fondo */
            background-size: cover; /* Ajusta la imagen para cubrir todo el elemento */
            background-position: center; /* Centra la imagen de fondo */
            background-repeat: no-repeat; /* Evita que la imagen se repita */
            background-attachment: fixed; /* Fija la imagen de fondo */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0; /* Elimina el margen por defecto del body */
        }

        .login-container {
            background-color: rgba(255, 255, 255, 0.9); /* Fondo blanco semitransparente para el formulario */
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); /* Sombra más pronunciada */
            width: 100%;
            max-width: 400px;
            text-align: center;
            backdrop-filter: blur(5px); /* Efecto de desenfoque en el fondo del contenedor */
        }

        .login-container h2 {
            color: var(--primary-color);
            margin-bottom: 30px;
            font-weight: bold;
        }

        .form-control {
            border-radius: 10px; /* Bordes redondeados para los campos */
            padding: 12px;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.25rem rgba(233, 30, 99, 0.25);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), #c2185b);
            border: none;
            border-radius: 25px;
            padding: 12px 25px; /* Relleno ajustado para el botón */
            font-weight: 600; /* Texto del botón más audaz */
            transition: all 0.3s ease;
            width: 100%;
            text-transform: uppercase; /* Texto del botón en mayúsculas */
            letter-spacing: 1px; /* Espaciado entre letras */
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #c2185b, #ad1457);
            transform: translateY(-3px); /* Pequeño levantamiento al pasar el mouse */
            box-shadow: 0 8px 20px rgba(233, 30, 99, 0.5); /* Sombra más grande al pasar el mouse */
        }

        .alert-danger {
            margin-top: 20px; /* Margen superior ajustado para el mensaje de error */
            border-radius: 10px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2><i class="fas fa-lock me-2"></i>Iniciar Sesión</h2>
        <form id="loginForm">
            <div class="mb-3">
                <input type="text" class="form-control" id="username" placeholder="Usuario" required>
            </div>
            <div class="mb-3">
                <input type="password" class="form-control" id="password" placeholder="Contraseña" required>
            </div>
            <button type="submit" class="btn btn-primary">Ingresar</button>
            <div id="errorMessage" class="alert alert-danger mt-3 d-none">
                Usuario o contraseña incorrectos.
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault(); // Evitar el envío por defecto del formulario

            const usernameInput = document.getElementById('username').value;
            const passwordInput = document.getElementById('password').value;
            const errorMessageDiv = document.getElementById('errorMessage');

            // Credenciales de prueba
            const correctUsername = 'admin';
            const correctPassword = '123456'; 

            if (usernameInput === correctUsername && passwordInput === correctPassword) {
                // Credenciales correctas, redirigir a index.html
                // Asegúrate de que 'index.html' sea el nombre correcto de tu archivo principal.
                // Si tu archivo principal se llama 'prototipo.html', cámbialo aquí.
                window.location.href = 'index.html'; 
            } else {
                // Credenciales incorrectas, mostrar mensaje de error
                errorMessageDiv.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
